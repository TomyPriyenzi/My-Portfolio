<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente lineal de Blanco puro a Violeta vibrante -->
    <linearGradient id="tp-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2D9F3" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Resplandor sutil para que resalte nítido sobre pestañas claras u oscuras -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fondo oscuro minimalista con bordes redondeados (estilo app icon moderno) -->
  <rect width="512" height="512" rx="112" fill="#09090b" />
  
  <!-- Borde perimetral tenue con acento violeta -->
  <rect width="512" height="512" rx="112" fill="none" stroke="#8B5CF6" stroke-width="8" stroke-opacity="0.25" />

  <!-- Monograma geométrico TP con gradiente blanco a violeta -->
  <g filter="url(#subtle-glow)" fill="url(#tp-gradient)">
    <!-- Letra T -->
    <path d="M 96 140 H 260 V 196 H 206 V 372 H 150 V 196 H 96 Z" />
    
    <!-- Letra P -->
    <path d="M 268 140 H 360 C 408 140 436 166 436 214 C 436 262 408 288 360 288 H 324 V 372 H 268 Z M 324 192 V 236 H 356 C 378 236 388 226 388 214 C 388 202 378 192 356 192 Z" />
  </g>
</svg>
